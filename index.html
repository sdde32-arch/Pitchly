    <!-- Safe Resilience Polyfills -->
    <script>
      (function() {
        // Safe in-memory storage fallback for partitioned/restricted iframe environments
        function createSafeStorage() {
          var store = {};
          return {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          };
        }

        ['localStorage', 'sessionStorage'].forEach(function(prop) {
          var works = false;
          try {
            var s = window[prop];
            if (s) {
              var t = '__pitchly_probe_' + prop + '__';
              s.setItem(t, '1');
              s.removeItem(t);
              works = true;
            }
          } catch (e) {
            works = false;
          }

          if (!works) {
            var mem = createSafeStorage();
            try {
              Object.defineProperty(window, prop, {
                get: function() { return mem; },
                set: function() {},
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              try {
                window[prop] = mem;
              } catch (err2) {}
            }
          }
        });

        // 3. Theme initialization to eliminate flash of wrong background
        try {
          var saved = window.localStorage ? window.localStorage.getItem('theme') : null;
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }

        // 4. Safe Notification polyfill to prevent SecurityError in iframes
        try {
          if ('Notification' in window) {
            var _testPerm = window.Notification.permission;
          }
        } catch (e) {
          try {
            Object.defineProperty(window, 'Notification', {
              value: {
                permission: 'denied',
                requestPermission: function() { return Promise.resolve('denied'); }
              },
              configurable: true,
              writable: true
            });
          } catch (err) {}
        }

        // 5. Safe matchMedia polyfill
        if (typeof window.matchMedia !== 'function') {
          window.matchMedia = function(q) {
            return {
              matches: false,
              media: q,
              onchange: null,
              addListener: function() {},
              removeListener: function() {},
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return false; }
            };
          };
        }

        // 6. Global error safety net: log warnings without destroying DOM
        window.addEventListener('error', function(e) {
          console.warn('[Pitchly] Window error caught:', e.message);
        });

        window.addEventListener('unhandledrejection', function(e) {
          console.warn('[Pitchly] Unhandled rejection caught:', e.reason);
        });
      })();
    </script>

        /* Premium Skeleton Shimmer Animations */
        @keyframes shimmer-slide {

        .shimmer-effect {

            overflow: hidden;

        .shimmer-effect::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
