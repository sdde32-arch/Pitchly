<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Base Light Squircle Tile (#FFFFFF) -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="#FFFFFF" />

  <!-- Logo Content Group -->
  <g transform="translate(10, 20)">
    <!-- Bold Black Letter P in Sora Font Style -->
    <text
      x="145"
      y="380"
      fill="#0F172A"
      font-family="Sora, system-ui, -apple-system, sans-serif"
      font-size="340"
      font-weight="800"
      letter-spacing="-0.035em"
    >p</text>

    <!-- Solid Darker Green Ball directly on top of letter P (no glare, no glow, no shadow) -->
    <circle cx="310" cy="115" r="46" fill="#15803D" />
  </g>
</svg>